<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support - Chat & Voice Call</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Konfigurasi & Peran -->
        <aside class="sidebar">
            <h2>IT Helpdesk</h2>
            <div class="config-group">
                <label>Supabase URL:</label>
                <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co">
                <label>Supabase Anon Key:</label>
                <input type="password" id="supabaseKey" placeholder="your-anon-key">
                <button id="btnConnect" onclick="initSupabase()">Hubungkan Supabase</button>
            </div>

            <div class="role-group">
                <label>Pilih Peran Anda:</label>
                <select id="roleSelect">
                    <option value="User">User (Klien)</option>
                    <option value="IT Support">IT Support</option>
                </select>
                <input type="text" id="userNameInput" placeholder="Nama Anda" value="User 1">
            </div>

            <!-- Area Kontrol Voice Call -->
            <div class="call-section">
                <h3>Voice Call</h3>
                <div id="callStatus" class="status-badge">Terputus</div>
                <div class="call-buttons">
                    <button id="btnStartCall" onclick="startCall()">📞 Panggil</button>
                    <button id="btnEndCall" onclick="endCall()" disabled>🚫 Tutup</button>
                    <button id="btnMute" onclick="toggleMute()" disabled>🔇 Mute</button>
                </div>
                <!-- Audio Element Remote Stream -->
                <audio id="remoteAudio" autoplay></audio>
            </div>
        </aside>

        <!-- Area Chat Utama -->
        <main class="chat-main">
            <header class="chat-header">
                <h3 id="chatTitle">Ruang Dukungan IT</h3>
                <span id="connectionBadge" class="badge offline">Offline</span>
            </header>

            <div class="chat-messages" id="chatMessages">
                <div class="system-message">Silakan hubungkan Supabase URL & Key untuk memulai.</div>
            </div>

            <form class="chat-input-area" id="chatForm" onsubmit="sendMessage(event)">
                <input type="text" id="messageInput" placeholder="Tulis pesan..." autocomplete="off" disabled>
                <button type="submit" id="btnSend" disabled>Kirim</button>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support - Chat & Voice Call</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Terpisah -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Supabase SDK dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Menu -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="fas fa-headset"></i>
                <h2>IT Support Portal</h2>
            </div>
            
            <div class="role-selector">
                <label for="roleSelect">Masuk Sebagai:</label>
                <select id="roleSelect">
                    <option value="user">User Umum</option>
                    <option value="it">IT Support</option>
                </select>
            </div>
            
            <div class="status-indicator">
                <span id="dbStatus" class="status-dot disconnected"></span>
                <span id="dbStatusText">Menghubungkan ke Supabase...</span>
            </div>
        </aside>

        <!-- Area Chat Utama -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="header-info">
                    <h3 id="chatHeaderTitle">Chat dengan IT Support</h3>
                    <p class="subtitle">Real-time chat & Voice Call</p>
                </div>
                <button id="callBtn" class="call-btn" title="Mulai Panggilan Suara">
                    <i class="fas fa-phone-alt"></i>
                </button>
            </header>

            <div class="messages-container" id="messagesContainer">
                <!-- Pesan akan muncul di sini -->
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Ketik pesan Anda di sini..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Modal Panggilan Suara -->
    <div class="modal-overlay" id="callModal">
        <div class="call-box">
            <div class="caller-avatar">
                <i class="fas fa-user-circle"></i>
            </div>
            <h3 id="callStatusText">Panggilan Masuk...</h3>
            <p id="callRoleText">Dari: IT Support</p>
            
            <div class="call-actions">
                <button id="acceptCallBtn" class="action-btn accept"><i class="fas fa-phone"></i> Terima</button>
                <button id="rejectCallBtn" class="action-btn reject"><i class="fas fa-phone-slash"></i> Tolak/Tutup</button>
            </div>
        </div>
    </div>

    <!-- Elemen Audio Tersembunyi untuk WebRTC -->
    <audio id="remoteAudio" autoplay hidden></audio>

    <!-- JavaScript Terpisah -->
    <script src="app.js"></script>
</body>
</html>
